[package]
name = "branchy-cli"
description = "A dependency-aware task tree in the terminal. Wire tasks together, see what is available now, ask what stands between you and a goal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["todo", "cli", "tasks", "graph", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "branchy"
path = "src/main.rs"

[dependencies]
branchy-app = { path = "../branchy-app", version = "0.1.2" }
branchy-core = { path = "../branchy-core", version = "0.1.2" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
