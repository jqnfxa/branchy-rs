[workspace]
resolver = "3"
members = ["crates/branchy-app", "crates/branchy-cli", "crates/branchy-core"]
# The desktop shell is its own workspace: pulling it in would make every
# `cargo check` need the platform webview libraries, on every CI runner.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jqnfxa/branchy-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
