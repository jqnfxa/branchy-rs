<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Branchy Skill Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">

<style>
:root{
  /* the phone safe areas the artifact host used to supply */
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  color-scheme: dark;

  /* dark is the product's default skin, not the host's — see settings */
  --bg:#10131c;
  --bg-elevated:#171c2b;
  --bg-card:#1c2233;
  --bg-sunken:#0b0e16;
  --stage-glow:#161b2b;
  --line:#2a3050;
  --line-soft:#232842;
  --locked:#363c56;
  --text:#e9ebf5;
  --text-dim:#8991ac;
  --danger:#e2666f;
  --on-accent:#0b0e16;
  --shadow:rgba(0,0,0,.55);

  --a-hard:#4fd1c5;
  --a-career:#eab64d;
  --a-health:#8fd17c;
  --a-social:#ef8093;

  /* Exo 2 covers Latin + Cyrillic + Greek; Noto Sans JP is loaded on demand
     and only ever resolves CJK codepoints, since it sits after the Latin faces. */
  --display:"Exo 2","Noto Sans JP",ui-sans-serif,system-ui,sans-serif;
  --body:"Manrope","Noto Sans JP",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","Noto Sans JP",ui-monospace,"SF Mono",Menlo,monospace;

  --dock-w:240px;
  --insp-w:326px;
}

body[data-skin="light"]{
  color-scheme: light;
  --bg:#eef0f7;
  --bg-elevated:#ffffff;
  --bg-card:#ffffff;
  --bg-sunken:#e4e7f1;
  --stage-glow:#ffffff;
  --line:#c3c9dd;
  --line-soft:#d9dded;
  --locked:#a9b0c6;
  --text:#161a27;
  --text-dim:#666e88;
  --danger:#c4404f;
  --on-accent:#ffffff;
  --shadow:rgba(30,36,60,.18);

  --a-hard:#12897e;
  --a-career:#9a6f10;
  --a-health:#3f8a2c;
  --a-social:#c94a63;
}

*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  font-size:14px;
  line-height:1.5;
  overflow:hidden;
}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;
  background:var(--bg-elevated);
  border-bottom:1px solid var(--line-soft);
  position:relative;z-index:6;
}
.brand{
  display:flex;align-items:baseline;gap:9px;
  font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;
}
.brand .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--a-hard);box-shadow:0 0 10px var(--a-hard);align-self:center;
}
.brand small{
  font-family:var(--body);font-weight:500;font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);
}

.seg{
  display:flex;background:var(--bg-sunken);
  border:1px solid var(--line-soft);border-radius:9px;padding:3px;gap:2px;
}
.seg button{
  font:inherit;font-size:12.5px;font-weight:600;
  color:var(--text-dim);background:transparent;border:0;border-radius:6px;
  padding:5px 11px;cursor:pointer;white-space:nowrap;
}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{
  background:var(--bg-card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);
}
.seg button .kb{
  font-family:var(--mono);font-size:9.5px;opacity:.55;margin-inline-start:5px;
}

.search{
  display:flex;align-items:center;gap:8px;
  background:var(--bg-sunken);border:1px solid var(--line-soft);
  border-radius:9px;padding-inline:10px;
  min-width:180px;flex:1 1 180px;max-width:340px;
}
.search svg{flex:none;color:var(--text-dim)}
.search input{
  font:inherit;font-size:13px;background:transparent;border:0;outline:none;
  color:var(--text);padding-block:7px;width:100%;min-width:0;
}
.search input::placeholder{color:var(--text-dim)}
.search.invalid{border-color:var(--danger)}
.rx{
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-dim);
  background:transparent;border:1px solid var(--line-soft);border-radius:5px;
  padding:2px 5px;cursor:pointer;flex:none;
}
.rx[aria-pressed="true"]{color:var(--on-accent);background:var(--a-hard);border-color:var(--a-hard)}

.spacer{flex:1 1 auto}
.tally{font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap}
.tally b{color:var(--text);font-weight:600}

.iconbtn{
  display:grid;place-items:center;width:32px;height:32px;flex:none;
  color:var(--text-dim);background:var(--bg-sunken);
  border:1px solid var(--line-soft);border-radius:8px;cursor:pointer;
  font:inherit;font-size:15px;
}
.iconbtn:hover{color:var(--text);border-color:var(--line)}

/* ---------- body row ---------- */
.row{position:relative;min-height:0;display:flex}
.row.dock-right{flex-direction:row-reverse}

.dock{
  width:var(--dock-w);flex:none;
  background:var(--bg-elevated);
  border-right:1px solid var(--line-soft);
  padding:14px 12px;overflow-y:auto;
  display:flex;flex-direction:column;gap:16px;z-index:4;
}
.row.dock-right .dock{border-right:0;border-left:1px solid var(--line-soft)}

.dock h2,.qhead h2{
  font-family:var(--body);font-size:10.5px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim);
  margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.dock h2 button{
  font:inherit;letter-spacing:.06em;color:var(--text-dim);
  background:transparent;border:1px solid var(--line-soft);
  border-radius:5px;padding:2px 6px;cursor:pointer;
}
.dock h2 button:hover{color:var(--text);border-color:var(--line)}

.areas{display:flex;flex-direction:column;gap:6px}
.area{
  --c:var(--a-hard);
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
  padding:8px 9px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;background:transparent;text-align:start;font:inherit;color:var(--text);width:100%;
}
.area:hover{background:var(--bg-card)}
.area[data-on="false"]{opacity:.38}
.area[data-focus="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent)}
.area .swatch{
  width:11px;height:11px;border-radius:3px;background:var(--c);
  box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent);
}
.area .nm{font-size:12.5px;font-weight:600;min-width:0}
.area .ct{font-family:var(--mono);font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.area .bar{grid-column:2/4;height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden}
.area .bar i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width .35s ease}

.hintlist{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--text-dim)}
.hintlist div{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hintlist span:first-child{min-width:0}
kbd{
  font-family:var(--mono);font-size:10.5px;
  background:var(--bg-sunken);border:1px solid var(--line-soft);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;color:var(--text);flex:none;
}

/* ---------- stage ---------- */
.stage{
  position:relative;flex:1 1 auto;min-width:0;overflow:hidden;
  background:radial-gradient(1100px 780px at 50% 46%, var(--stage-glow) 0%, var(--bg) 62%);
  cursor:grab;touch-action:none;
}
.stage.grabbing{cursor:grabbing}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.zoom{position:absolute;inset-inline-end:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;z-index:3}
.zoom button{
  width:32px;height:32px;display:grid;place-items:center;
  font:inherit;font-size:14px;font-weight:600;color:var(--text-dim);
  background:color-mix(in srgb,var(--bg-elevated) 88%,transparent);
  border:1px solid var(--line-soft);border-radius:8px;cursor:pointer;backdrop-filter:blur(6px);
}
.zoom button:hover{color:var(--text);border-color:var(--line)}
.zoom .lvl{font-family:var(--mono);font-size:10px;color:var(--text-dim);text-align:center;padding-top:2px;font-variant-numeric:tabular-nums}

.legend{
  position:absolute;inset-inline-start:12px;bottom:12px;
  display:flex;gap:14px;flex-wrap:wrap;padding:8px 11px;
  background:color-mix(in srgb,var(--bg-elevated) 88%,transparent);
  border:1px solid var(--line-soft);border-radius:9px;backdrop-filter:blur(6px);
  font-size:11px;color:var(--text-dim);z-index:3;pointer-events:none;
}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend .l-done{background:var(--a-hard)}
.legend .l-avail{background:transparent;box-shadow:inset 0 0 0 2px var(--a-hard)}
.legend .l-locked{background:transparent;box-shadow:inset 0 0 0 2px var(--locked)}
.legend .l-cross{width:18px;height:0;border-radius:0;border-top:2px dashed var(--a-career)}

/* ---------- svg ---------- */
.link{fill:none;stroke-linecap:round;transition:opacity .25s ease}
.link.state-locked{stroke:var(--locked);stroke-width:1.4;opacity:.55}
.link.state-open{stroke-width:1.8;opacity:.5}
.link.state-done{stroke-width:2.2;opacity:.85}
.link.cross{stroke-dasharray:5 5}
.link.on-path{opacity:1;stroke-width:2.6;stroke-dasharray:7 7;animation:flow 1.05s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}

.node{cursor:pointer}
.node .disc{fill:var(--bg-card);stroke:var(--locked);stroke-width:1.6;transition:fill .25s ease,stroke .25s ease}
.node .halo{fill:none;stroke-width:1.4;opacity:0}
.node .glyph{stroke-linecap:round;stroke-linejoin:round}
.node .label{
  font-family:var(--display);font-size:11.5px;font-weight:600;text-anchor:middle;
  fill:var(--text-dim);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;
  pointer-events:none;transition:opacity .2s ease,fill .25s ease;
}
.node .hit{fill:transparent}
.node:focus{outline:none}
.node:focus-visible .disc{stroke:var(--text);stroke-width:2.6}

.node.locked{opacity:.62}
.node.locked .glyph{stroke:var(--locked);fill:none}

.node.available .disc{stroke:var(--c);stroke-width:2}
.node.available .glyph{fill:var(--c);stroke:none}
.node.available .label{fill:var(--text)}
.node.available .halo{
  stroke:var(--c);opacity:.5;
  transform-box:fill-box;transform-origin:center;
  animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:0;transform:scale(1.42)}}

.node.done .disc{fill:color-mix(in srgb,var(--c) 26%,var(--bg-card));stroke:var(--c);stroke-width:1.8}
.node.done .glyph{stroke:var(--c);fill:none;stroke-width:2}
.node.done .label{fill:var(--text)}

.node.sel .disc{stroke:var(--text);stroke-width:2.8}
.node.sel .label{fill:var(--text)}
.node:hover .label{fill:var(--text)}

.node,.link{transition:opacity .25s ease}
.faded{opacity:.12!important}
.faded .label{opacity:0}
.hide-labels .label{opacity:0}

.node.just-freed .disc{animation:freed 1.5s ease-out 1}
@keyframes freed{
  0%{stroke-width:2;filter:none}
  18%{stroke-width:7;filter:drop-shadow(0 0 14px var(--c))}
  100%{stroke-width:2;filter:none}
}
.burst{fill:none;stroke-width:3;pointer-events:none}

.sector-label{
  font-family:var(--display);font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;opacity:.75;
}
.you circle.plate{fill:var(--bg-elevated);stroke:var(--line);stroke-width:1.5}
.you circle.track{fill:none;stroke:var(--line-soft);stroke-width:4}
.you circle.prog{fill:none;stroke:var(--a-hard);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.you text.who{
  font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-anchor:middle;fill:var(--text-dim);
}
.you text.pct{
  font-family:var(--mono);font-size:12px;font-weight:600;text-anchor:middle;fill:var(--text);
}
.ring{fill:none;stroke:var(--line-soft);stroke-width:1;opacity:.5;stroke-dasharray:2 6}

/* ---------- inspector ---------- */
.inspector{
  width:var(--insp-w);flex:none;background:var(--bg-elevated);
  border-left:1px solid var(--line-soft);padding:16px 16px 22px;overflow-y:auto;z-index:5;
}
.row.dock-right .inspector{border-left:0;border-right:1px solid var(--line-soft)}

.insp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.chip{
  --c:var(--a-hard);
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);
  border-radius:999px;padding:3px 9px;
}
.xbtn{font:inherit;font-size:16px;line-height:1;color:var(--text-dim);background:transparent;border:0;cursor:pointer;padding:2px 4px}
.xbtn:hover{color:var(--text)}

.insp h3{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.2;margin:10px 0 6px;text-wrap:balance}
.insp .meta{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;
}
.insp .note{font-size:13px;color:var(--text-dim);margin:0 0 16px;max-width:62ch}

.insp h4{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim);margin:0 0 7px}
.deps{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:4px}
.deps li{
  display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 8px;
  border-radius:7px;background:var(--bg-card);border:1px solid var(--line-soft);cursor:pointer;
}
.deps li:hover{border-color:var(--line)}
.deps li .mark{font-family:var(--mono);font-size:12px;flex:none;width:12px}
.deps li.met .mark{color:var(--a-health)}
.deps li.unmet .mark{color:var(--danger)}
.deps li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deps li .from{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;flex:none}
.deps .empty{background:transparent;border:1px dashed var(--line-soft);color:var(--text-dim);cursor:default;font-size:12px}

.act{
  width:100%;font:inherit;font-family:var(--display);font-size:14px;font-weight:700;
  letter-spacing:.03em;padding:11px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg-card);color:var(--text);cursor:pointer;
}
.act.primary{--c:var(--a-hard);background:var(--c);border-color:var(--c);color:var(--on-accent)}
.act:disabled{color:var(--text-dim);cursor:not-allowed;opacity:.7}

/* ---------- queue ---------- */
.queue{
  position:absolute;top:0;bottom:0;inset-inline-start:0;width:326px;
  background:color-mix(in srgb,var(--bg-elevated) 96%,transparent);
  backdrop-filter:blur(10px);
  border-inline-end:1px solid var(--line-soft);
  padding:16px;overflow-y:auto;z-index:5;
}
.row.dock-right .queue{inset-inline-start:auto;inset-inline-end:0}
.qhead{display:flex;align-items:center;justify-content:space-between}
.queue > p{font-size:12px;color:var(--text-dim);margin:0 0 14px;max-width:44ch}
.qlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.qlist li{
  --c:var(--a-hard);
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  padding:9px 11px;background:var(--bg-card);border:1px solid var(--line-soft);
  border-inline-start:3px solid var(--c);border-radius:8px;cursor:pointer;
}
.qlist li:hover{border-color:var(--line);border-inline-start-color:var(--c)}
.qlist .pri{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}
.qlist .nm{font-size:13px;font-weight:600;min-width:0}
.qlist .sub{font-size:11px;color:var(--text-dim)}
.qlist .tag{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c)}

/* ---------- settings ---------- */
dialog.settings{
  border:1px solid var(--line);border-radius:14px;padding:0;
  background:var(--bg-elevated);color:var(--text);
  width:min(440px,calc(100vw - 32px));
  box-shadow:0 24px 70px var(--shadow);
}
dialog.settings::backdrop{background:rgba(6,8,14,.62);backdrop-filter:blur(3px)}
.set-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 18px;border-bottom:1px solid var(--line-soft);
}
.set-head h2{font-family:var(--display);font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
.set-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field > label{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--text-dim)}
.field .help{font-size:11.5px;color:var(--text-dim);margin:0;max-width:52ch}
.field select{
  font:inherit;font-size:13.5px;color:var(--text);
  background:var(--bg-card);border:1px solid var(--line-soft);border-radius:8px;
  padding:9px 10px;width:100%;cursor:pointer;
}
.choices{display:flex;gap:6px;flex-wrap:wrap}
.choices button{
  font:inherit;font-size:12.5px;font-weight:600;color:var(--text-dim);
  background:var(--bg-card);border:1px solid var(--line-soft);border-radius:8px;
  padding:7px 12px;cursor:pointer;flex:1 1 auto;white-space:nowrap;
}
.choices button:hover{color:var(--text)}
.choices button[aria-pressed="true"]{
  color:var(--text);border-color:var(--a-hard);
  background:color-mix(in srgb,var(--a-hard) 14%,var(--bg-card));
}
.choices button .kb{font-family:var(--mono);font-size:9.5px;opacity:.6;margin-inline-start:6px}

/* ---------- command palette ---------- */
.palette{
  position:fixed;inset:0;z-index:20;
  display:grid;place-items:start center;
  padding-top:min(14vh,120px);padding-inline:16px;
  background:rgba(6,8,14,.55);backdrop-filter:blur(3px);
}
body[data-skin="light"] .palette{background:rgba(120,128,160,.34)}
.pal-box{
  width:min(640px,100%);background:var(--bg-elevated);
  border:1px solid var(--line);border-radius:12px;
  box-shadow:0 26px 70px var(--shadow);overflow:hidden;
}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.pal-in .prompt{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--a-hard);flex:none}
.pal-in input{
  font:inherit;font-family:var(--mono);font-size:14px;
  background:transparent;border:0;outline:none;color:var(--text);width:100%;min-width:0;
}
.pal-in input::placeholder{color:var(--text-dim)}
.pal-out{padding:11px 14px;font-size:12.5px;color:var(--text-dim);min-height:40px;line-height:1.45}
.pal-out b{color:var(--text);font-weight:600}
.pal-out.err{color:var(--danger)}
.pal-out.err b{color:var(--danger)}
.pal-out .cyc{font-family:var(--mono);font-size:11.5px;display:block;margin-top:5px;color:var(--danger);word-break:break-word}
.pal-sugg{list-style:none;margin:0;padding:0 10px 10px;display:flex;flex-wrap:wrap;gap:5px}
.pal-sugg li{
  font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:6px;
  background:var(--bg-card);border:1px solid var(--line-soft);color:var(--text-dim);cursor:pointer;
}
.pal-sugg li:hover{color:var(--text);border-color:var(--line)}
.pal-hint{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  padding:0 14px 12px;word-break:break-word;
}

/* ---------- footer ---------- */
.footer{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:7px 16px;padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));
  background:var(--bg-elevated);border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--text-dim);z-index:6;
}
.footer .note{margin-inline-start:auto;font-style:italic;opacity:.85}

}

<body>
<div class="app">
  <header class="topbar">
    <button class="iconbtn dock-toggle" id="dockToggle" aria-label="Directions">☰</button>
    <div class="brand"><span class="dot"></span>Branchy <small id="tagline">prototype</small></div>

    <div class="seg" id="layoutSeg" role="group" aria-label="Layout"></div>

    <div class="search" id="searchWrap">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6"></circle><path d="M10.4 10.4 L14 14" stroke-linecap="round"></path>
      </svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false">
      <button class="rx" id="rxBtn" aria-pressed="false" title="Regular expression">.*</button>
    </div>

    <span class="spacer"></span>
    <span class="seg"><button id="queueBtn" aria-pressed="false"></button></span>
    <div class="tally" id="tally"></div>
    <button class="iconbtn" id="setBtn" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="8" cy="8" r="2.4"></circle>
        <path d="M8 1.4v1.8M8 12.8v1.8M14.6 8h-1.8M3.2 8H1.4M12.67 3.33l-1.27 1.27M4.6 11.4l-1.27 1.27M12.67 12.67l-1.27-1.27M4.6 4.6L3.33 3.33" stroke-linecap="round"></path>
      </svg>
    </button>
  </header>

  <div class="row" id="row">
    <aside class="dock" id="dock">
      <div>
        <h2><span id="lblDirections"></span> <button id="allBtn" type="button"></button></h2>
        <div class="areas" id="areas"></div>
      </div>
      <div>
        <h2 id="lblKeys"></h2>
        <div class="hintlist" id="keyHints"></div>
      </div>
    </aside>

    <main class="stage" id="stage">
      <svg id="canvas" aria-label="Dependency graph"></svg>

      <div class="legend" id="legend"></div>

      <div class="zoom">
        <button id="zIn" aria-label="Zoom in">+</button>
        <button id="zOut" aria-label="Zoom out">−</button>
        <button id="zFit" aria-label="Fit">⤢</button>
        <div class="lvl" id="zLvl">100%</div>
      </div>

      <aside class="queue" id="queue" hidden>
        <div class="qhead">
          <h2 id="qTitle"></h2>
          <button class="xbtn" id="qClose" aria-label="Close">×</button>
        </div>
        <p id="qBlurb"></p>
        <ul class="qlist" id="qlist"></ul>
      </aside>
    </main>

    <aside class="inspector" id="inspector" hidden></aside>
  </div>

  <footer class="footer" id="footer"></footer>
</div>

<dialog class="settings" id="settings">
  <div class="set-head">
    <h2 id="setTitle"></h2>
    <button class="xbtn" id="setClose" aria-label="Close">×</button>
  </div>
  <div class="set-body" id="setBody"></div>
</dialog>

<div class="palette" id="palette" hidden>
  <div class="pal-box" role="dialog" aria-label="Command line">
    <div class="pal-in">
      <span class="prompt">:</span>
      <input id="pal" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="pal-out" id="palOut"></div>
    <ul class="pal-sugg" id="palSugg"></ul>
    <div class="pal-hint" id="palHint"></div>
  </div>
</div>

function plural(locale, n, forms){
  try{

  return forms.other !== undefined ? forms.other : forms.one;
}
function num(locale, n){

  });
}

/* derived: tier and status, never stored */
function computeTiers(){
  var tier = {}, mark = {};
  function walk(id){
    if(tier[id] !== undefined) return tier[id];
    if(mark[id]) return 0;
    mark[id] = true;
    var max = -1;
    byId[id].prereqs.forEach(function(p){ if(byId[p]) max = Math.max(max, walk(p)); });
    mark[id] = false;
    tier[id] = max + 1;
    return tier[id];
  }
  NODES.forEach(function(n){ walk(n.id); });
  return tier;
}
function statusOf(n){
  if(n.done) return "done";
  return n.prereqs.every(function(p){ return !byId[p] || byId[p].done; }) ? "available" : "locked";
}
var TIER = {}, dependents = {};

// Every derived index is rebuilt from the node list, so a command only ever has
// to mutate NODES and call this. Nothing derived is ever stored.
function reindex(){
  byId = {};
  NODES.forEach(function(n){ byId[n.id] = n; });
  TIER = computeTiers();
  dependents = {};
  NODES.forEach(function(n){ dependents[n.id] = []; });
  NODES.forEach(function(n){
    n.prereqs.forEach(function(p){ if(dependents[p]) dependents[p].push(n.id); });
  });
}
reindex();

function closureOf(id){
  var set = {}, stack = [id];
  set[id] = true;
  while(stack.length){
    var cur = stack.pop();
    byId[cur].prereqs.forEach(function(p){ if(byId[p] && !set[p]){ set[p] = true; stack.push(p); } });
  }
  stack = [id];
  var down = {};
  down[id] = true;
  while(stack.length){
    var c = stack.pop();
    dependents[c].forEach(function(d){ if(!down[d]){ down[d] = true; set[d] = true; stack.push(d); } });
  }
  return set;
}

/* ============================================================
   5. Three layouts over one graph
   ============================================================ */

var R0 = 150, RING = 118, COL = 210, ROW = 92;

function groupByTier(list){
  var max = 0;
  list.forEach(function(n){ max = Math.max(max, TIER[n.id]); });
  var out = [];
  for(var i = 0; i <= max; i++) out.push([]);
  list.forEach(function(n){ out[TIER[n.id]].push(n); });
  return out;
}
function prng(seed){
  var h = 2166136261;
  for(var i = 0; i < seed.length; i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){
    h += 0x6D2B79F5;
    var x = h;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

function layoutRadial(jitter){
  var pos = {}, sectors = [], rings = 0;
  var areas = AREAS.filter(function(a){ return state.focus ? a.id === state.focus : state.visible[a.id]; });
  var per = {}, total = 0;
  areas.forEach(function(a){
    per[a.id] = shownNodes().filter(function(n){ return n.area === a.id; });
    total += Math.max(1, per[a.id].length);
  });
  if(!total) return {pos:pos, sectors:sectors, rings:rings};

  var gap = areas.length > 1 ? 0.13 : 0;
  var free = Math.PI * 2 - gap * areas.length;
  var angle = -Math.PI / 2;

  areas.forEach(function(a){
    var list = per[a.id];
    var span = free * (Math.max(1, list.length) / total);
    var start = angle + gap / 2;
    var tiers = groupByTier(list);
    // Only tiers that actually occur in this direction get a ring. Career starts
    // at tier 1 and skips tier 2, so without this it would sit alone far out and
    // the whole disc would have to zoom out to fit it.
    var ringOf = 0;
    tiers.forEach(function(row){
      if(!row.length) return;
      var idx = ringOf++;
      rings = Math.max(rings, idx);
      var r = R0 + idx * RING;
      row.forEach(function(n, i){
        var th = start + ((i + 0.5) / row.length) * span;
        var rr = r;
        if(jitter){
          var rnd = prng(n.id);
          th += (rnd() - 0.5) * span * 0.34;
          rr += (rnd() - 0.5) * RING * 0.62;
        }
        pos[n.id] = {x:Math.cos(th) * rr, y:Math.sin(th) * rr};
      });
    });
    sectors.push({area:a, mid:start + span / 2, r:R0 + (ringOf - 0.35) * RING});
    angle += span + gap;
  });
  return {pos:pos, sectors:sectors, rings:rings};
}

function layoutLayered(){
  var pos = {}, sectors = [], y = 0;
  var areas = AREAS.filter(function(a){ return state.focus ? a.id === state.focus : state.visible[a.id]; });
  areas.forEach(function(a){
    var list = shownNodes().filter(function(n){ return n.area === a.id; });
    if(!list.length) return;
    var tiers = groupByTier(list), rows = 1;
    tiers.forEach(function(r){ rows = Math.max(rows, r.length); });
    tiers.forEach(function(row, tIdx){
      var off = (rows - row.length) / 2;
      row.forEach(function(n, i){ pos[n.id] = {x:tIdx * COL, y:y + (off + i) * ROW}; });
    });
    sectors.push({area:a, band:{y0:y, y1:y + (rows - 1) * ROW}});
    y += rows * ROW + 78;
  });
  return {pos:pos, sectors:sectors, layered:true};
}

function computeLayout(){
  if(state.layout === "layered") return layoutLayered();
  return layoutRadial(state.layout === "web");
}

var LAY = null;

function linkPath(a, b, cross){
  if(LAY.layered){
    var dx = Math.max(38, Math.abs(b.x - a.x) * 0.45);
    return "M" + a.x + " " + a.y + " C" + (a.x + dx) + " " + a.y + "," + (b.x - dx) + " " + b.y + "," + b.x + " " + b.y;
  }
  var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  var pull = cross ? 0.55 : 0.14;
  return "M" + a.x + " " + a.y + " Q" + (mx * (1 - pull)) + " " + (my * (1 - pull)) + " " + b.x + " " + b.y;
}

function glyphFor(status){

  }else if(status === "available"){
    p = el("path", {d:"M0 -4.8 L4.8 0 L0 4.8 L-4.8 0 Z"});
  }else{
    p = el("g");
    p.appendChild(el("rect", {x:-3.6, y:-0.4, width:7.2, height:5.4, rx:1, fill:"none", "stroke-width":"1.5"}));
    p.appendChild(el("path", {d:"M-2 -0.4 V-2.2 a2 2 0 0 1 4 0 V-0.4", fill:"none", "stroke-width":"1.5"}));
  }
  p.setAttribute("class", "glyph");
  return p;
}

function drawHub(){
  var done = NODES.filter(function(n){ return n.done; }).length;
  var pct = NODES.length ? done / NODES.length : 0;
  var r = 44, c = 2 * Math.PI * r;
  var g = el("g", {class:"you"});
  g.appendChild(el("circle", {class:"plate", cx:0, cy:0, r:34}));
  g.appendChild(el("circle", {class:"track", cx:0, cy:0, r:r}));
  g.appendChild(el("circle", {
    class:"prog", cx:0, cy:0, r:r,
    "stroke-dasharray":c, "stroke-dashoffset":c * (1 - pct),
    transform:"rotate(-90)"
  }));
  var who = el("text", {class:"who", x:0, y:-4});
  who.textContent = "YOU";
  var pc = el("text", {class:"pct", x:0, y:11});
  pc.textContent = Math.round(pct * 100) + "%";
  g.appendChild(who); g.appendChild(pc);
  return g;
}

function render(){
  LAY = computeLayout();
  gDecor.textContent = ""; gLinks.textContent = ""; gNodes.textContent = ""; gFx.textContent = "";
  var pos = LAY.pos;

    });
  }

  NODES.forEach(function(n){
    if(!isShown(n.id)) return;
    n.prereqs.forEach(function(pid){
      var p = byId[pid];
      if(!p || !isShown(pid)) return;
      var a = pos[pid], b = pos[n.id];
      if(!a || !b) return;
      var cross = p.area !== n.area;
      var st = p.done ? (n.done ? "done" : "open") : "locked";
      var path = el("path", {class:"link state-" + st + (cross ? " cross" : ""), d:linkPath(a, b, cross)});
      if(st !== "locked") path.setAttribute("stroke", areaColor(p.area));
      path.dataset.from = pid;
      path.dataset.to = n.id;
      gLinks.appendChild(path);
    });
  });

  shownNodes().forEach(function(n){
    var p = pos[n.id];
    if(!p) return;
    var st = statusOf(n);
    var g = el("g", {
      class:"node " + st + (state.selected === n.id ? " sel" : ""),
      transform:"translate(" + p.x + "," + p.y + ")",
      tabindex:"0", role:"button"
    });
    g.style.setProperty("--c", areaColor(n.area));
    g.dataset.id = n.id;
    g.appendChild(el("circle", {class:"halo", cx:0, cy:0, r:24}));
    g.appendChild(el("circle", {class:"disc", cx:0, cy:0, r:18}));
    g.appendChild(glyphFor(st));
    var label = el("text", {class:"label", x:0, y:34});
    label.textContent = n.name;
    g.appendChild(label);
    g.appendChild(el("circle", {class:"hit", cx:0, cy:0, r:26}));
    var title = el("title");
    title.textContent = n.name + " — " + t("st." + st);
    g.appendChild(title);
    g.addEventListener("click", function(ev){ ev.stopPropagation(); select(n.id); });
    g.addEventListener("keydown", function(ev){
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); select(n.id); }
    });
    gNodes.appendChild(g);
  });

  updateEmphasis();
  applyTransform();
}

/* ============================================================
   7. Camera — smooth pan and zoom
   ============================================================ */

var animId = null;

function applyTransform(){
  var v = state.view;
  world.setAttribute("transform", "translate(" + v.x + "," + v.y + ") scale(" + v.k + ")");
  document.getElementById("zLvl").textContent = Math.round(v.k * 100) + "%";
  gNodes.classList.toggle("hide-labels", v.k < 0.52);
}

function tweenTo(target, ms){
  if(animId) cancelAnimationFrame(animId);
  if(!motionOn() || !ms){
    state.view.x = target.x; state.view.y = target.y; state.view.k = target.k;
    applyTransform();
    return;
  }
  var from = {x:state.view.x, y:state.view.y, k:state.view.k};
  var t0 = performance.now();
  (function step(now){
    var p = Math.min(1, (now - t0) / ms);
    var e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    // zoom interpolates geometrically, which is what reads as "smooth"
    state.view.k = from.k * Math.pow(target.k / from.k, e);
    state.view.x = from.x + (target.x - from.x) * e;
    state.view.y = from.y + (target.y - from.y) * e;
    applyTransform();
    if(p < 1) animId = requestAnimationFrame(step);
  })(performance.now());
}

function fitTarget(){
  var keys = Object.keys(LAY.pos);
  if(!keys.length) return null;
  var pad = 96, x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  keys.forEach(function(id){
    var p = LAY.pos[id];
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  });
  if(!LAY.layered){
    x0 = Math.min(x0, -60); x1 = Math.max(x1, 60);
    y0 = Math.min(y0, -60); y1 = Math.max(y1, 60);
  }
  x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  var w = stage.clientWidth, h = stage.clientHeight;
  var k = Math.max(0.28, Math.min(1.6, Math.min(w / (x1 - x0), h / (y1 - y0))));
  return {k:k, x:w / 2 - ((x0 + x1) / 2) * k, y:h / 2 - ((y0 + y1) / 2) * k};
}
function fit(ms){
  var target = fitTarget();
  if(target) tweenTo(target, ms === undefined ? 420 : ms);
}

function flyTo(id){
  var p = LAY.pos[id];
  if(!p) return;
  // zoom in toward a comfortable reading scale, but never pull back out
  var k = Math.max(state.view.k, 1.15);
  k = Math.min(k, 1.6);
  tweenTo({k:k, x:stage.clientWidth / 2 - p.x * k, y:stage.clientHeight / 2 - p.y * k}, 560);
}

(function wirePanZoom(){
  var drag = null;
  stage.addEventListener("pointerdown", function(ev){
    if(ev.target.closest(".zoom, .queue")) return;
    if(animId) cancelAnimationFrame(animId);
    drag = {x:ev.clientX, y:ev.clientY, vx:state.view.x, vy:state.view.y, moved:false};
    stage.classList.add("grabbing");
    stage.setPointerCapture(ev.pointerId);
  });
  stage.addEventListener("pointermove", function(ev){
    if(!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if(Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    state.view.x = drag.vx + dx;
    state.view.y = drag.vy + dy;
    applyTransform();
  });
  stage.addEventListener("pointerup", function(ev){
    if(drag && !drag.moved && !ev.target.closest(".node")) select(null);
    drag = null;
    stage.classList.remove("grabbing");
  });
  stage.addEventListener("pointercancel", function(){ drag = null; stage.classList.remove("grabbing"); });
  stage.addEventListener("wheel", function(ev){
    ev.preventDefault();
    var rect = stage.getBoundingClientRect();
    zoomAt(ev.clientX - rect.left, ev.clientY - rect.top, Math.exp(-ev.deltaY * 0.0016));
  }, {passive:false});

  function zoomAt(mx, my, factor){
    if(animId) cancelAnimationFrame(animId);
    var v = state.view;
    var k = Math.max(0.22, Math.min(2.6, v.k * factor));
    v.x = mx - (mx - v.x) * (k / v.k);
    v.y = my - (my - v.y) * (k / v.k);
    v.k = k;
    applyTransform();
  }
  document.getElementById("zIn").onclick = function(){ zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.3); };
  document.getElementById("zOut").onclick = function(){ zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 0.77); };
  document.getElementById("zFit").onclick = function(){ fit(); };
})();

/* ============================================================
   8. Emphasis — search wins, otherwise trace the selected path
   ============================================================ */

var searchWrap = document.getElementById("searchWrap");

function queryHits(){
  var q = state.query.trim();
  searchWrap.classList.remove("invalid");
  if(!q) return null;
  var test;
  if(state.regex){
    try{ var re = new RegExp(q, "i"); test = function(s){ return re.test(s); }; }
    catch(e){ searchWrap.classList.add("invalid"); return null; }
  }else{
    var lo = q.toLowerCase();
    test = function(s){ return s.toLowerCase().indexOf(lo) !== -1; };
  }
  var hits = {};
  NODES.forEach(function(n){
    if(test(n.name) || test(n.note) || test(areaById[n.area].name)) hits[n.id] = true;
  });
  return hits;
}

function updateEmphasis(){
  var hits = queryHits();
  var path = null;
  if(!hits && state.selected && state.trace) path = closureOf(state.selected);
  var set = hits || path;

  Array.prototype.forEach.call(gNodes.children, function(g){
    g.classList.toggle("faded", !!set && !set[g.dataset.id]);
  });
  Array.prototype.forEach.call(gLinks.children, function(p){
    var on = !set || (set[p.dataset.from] && set[p.dataset.to]);
    p.classList.toggle("faded", !on);
    p.classList.toggle("on-path", !!path && on);
  });
}

/* ============================================================
   9. Selection and inspector
   ============================================================ */

var inspector = document.getElementById("inspector");

function select(id, fly, trace){
  state.selected = id;
  state.trace = trace !== false;
  Array.prototype.forEach.call(gNodes.children, function(g){
    g.classList.toggle("sel", g.dataset.id === id);
  });
  updateEmphasis();
  if(!id){ inspector.hidden = true; return; }
  drawInspector(byId[id]);
  inspector.hidden = false;
  if(fly !== false) flyTo(id);
}

function drawInspector(n){
  var st = statusOf(n), area = areaById[n.area], c = areaColor(n.area);
  inspector.innerHTML = "";
  inspector.style.setProperty("--c", c);

  var head = document.createElement("div");
  head.className = "insp-head";
  var chip = document.createElement("span");
  chip.className = "chip";
  chip.style.setProperty("--c", c);
  chip.textContent = area.name;
  var x = document.createElement("button");
  x.className = "xbtn"; x.type = "button"; x.textContent = "×";
  x.setAttribute("aria-label", "Close");
  x.onclick = function(){ select(null); };
  head.appendChild(chip); head.appendChild(x);
  inspector.appendChild(head);

  var body = document.createElement("div");
  body.className = "insp";

  var h = document.createElement("h3");
  h.textContent = n.name;
  body.appendChild(h);

  var meta = document.createElement("div");
  meta.className = "meta";
  [t("tier", {t:TIER[n.id]}), t("priority", {p:n.priority}), t("st." + st)].forEach(function(s){
    var el2 = document.createElement("span");
    el2.textContent = s;
    meta.appendChild(el2);
  });
  body.appendChild(meta);

  var note = document.createElement("p");
  note.className = "note";
  note.textContent = n.note;
  body.appendChild(note);

  body.appendChild(depList(t("needs"), n.prereqs, true, n));
  body.appendChild(depList(t("unlocksLbl"), dependents[n.id], false, n));

  var btn = document.createElement("button");
  btn.className = "act" + (st === "available" ? " primary" : "");
  btn.type = "button";
  btn.style.setProperty("--c", c);
  if(st === "done"){
    btn.textContent = t("act.undo");
    btn.onclick = function(){ setDone(n, false); };
  }else if(st === "available"){
    btn.textContent = t("act.unlock");
    btn.onclick = function(){ setDone(n, true); };
  }else{
    var missing = n.prereqs.filter(function(p){ return byId[p] && !byId[p].done; }).length;
    btn.textContent = t("act.locked", {n:missing});
    btn.disabled = true;
  }
  body.appendChild(btn);
  inspector.appendChild(body);
}

function depList(title, ids, showMet, owner){
  var wrap = document.createElement("div");
  var h4 = document.createElement("h4");
  h4.textContent = title;
  wrap.appendChild(h4);
  var ul = document.createElement("ul");
  ul.className = "deps";
  if(!ids.length){
    var li0 = document.createElement("li");
    li0.className = "empty";
    li0.textContent = showMet ? t("noNeeds") : t("noUnlocks");
    ul.appendChild(li0);
  }
  ids.forEach(function(pid){
    var p = byId[pid];
    if(!p) return;
    var li = document.createElement("li");
    li.className = showMet ? (p.done ? "met" : "unmet") : "";
    var mark = document.createElement("span");
    mark.className = "mark";
    mark.textContent = showMet ? (p.done ? "✓" : "✕") : "→";
    var nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = p.name;
    li.appendChild(mark); li.appendChild(nm);
    if(owner && p.area !== owner.area){
      var from = document.createElement("span");
      from.className = "from";
      from.style.color = areaColor(p.area);
      from.textContent = areaById[p.area].name.split(" ")[0];
      li.appendChild(from);
    }
    li.onclick = function(){
      if(!isShown(pid)){ state.focus = null; state.visible[p.area] = true; paintAreas(); render(); }
      select(pid);
    };
    ul.appendChild(li);
  });
  wrap.appendChild(ul);
  return wrap;
}

/* unlocking: the one moment the app should feel like a game */
function setDone(n, done){
  var before = {};
  NODES.forEach(function(x){ before[x.id] = statusOf(x); });
  n.done = done;
  render();
  drawInspector(n);
  paintAreas(); paintTally(); paintQueue();

  if(done && motionOn()){
    burstAt(n.id, areaColor(n.area));
    dependents[n.id].forEach(function(d){
      if(before[d] === "locked" && statusOf(byId[d]) === "available"){
        var g = nodeEl(d);
        if(g) g.classList.add("just-freed");
      }
    });
  }
}
function nodeEl(id){
  return Array.prototype.filter.call(gNodes.children, function(g){ return g.dataset.id === id; })[0];
}
function burstAt(id, color){
  var p = LAY.pos[id];
  if(!p) return;
  var c = el("circle", {class:"burst", cx:p.x, cy:p.y, r:18, stroke:color});
  gFx.appendChild(c);
  var t0 = performance.now(), dur = 620;
  (function step(now){
    var k = Math.min(1, (now - t0) / dur);
    c.setAttribute("r", 18 + k * 52);
    c.setAttribute("stroke-opacity", String(1 - k));
    c.setAttribute("stroke-width", String(3 * (1 - k) + 0.6));
    if(k < 1) requestAnimationFrame(step);
    else if(c.parentNode) c.parentNode.removeChild(c);
  })(t0);
}

var LAYOUTS = ["radial", "layered", "web"];
var areasEl = document.getElementById("areas");

function paintAreas(){
  areasEl.innerHTML = "";
  AREAS.forEach(function(a){
    var list = NODES.filter(function(n){ return n.area === a.id; });
    var done = list.filter(function(n){ return n.done; }).length;
    var b = document.createElement("button");
    b.className = "area";
    b.type = "button";
    b.style.setProperty("--c", areaColor(a.id));
    b.dataset.on = state.focus ? String(a.id === state.focus) : String(state.visible[a.id]);
    b.dataset.focus = String(state.focus === a.id);

    var sw = document.createElement("span"); sw.className = "swatch";
    var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = a.name;
    var ct = document.createElement("span"); ct.className = "ct";
    ct.textContent = num(langById[state.lang].locale, done) + "/" + num(langById[state.lang].locale, list.length);
    var bar = document.createElement("span"); bar.className = "bar";
    var fill = document.createElement("i");
    fill.style.width = (list.length ? (done / list.length) * 100 : 0) + "%";
    bar.appendChild(fill);
    b.appendChild(sw); b.appendChild(nm); b.appendChild(ct); b.appendChild(bar);

    sw.addEventListener("click", function(ev){
      ev.stopPropagation();
      state.focus = null;
      state.visible[a.id] = !state.visible[a.id];
      paintAreas(); render(); fit();
    });
    b.addEventListener("click", function(){
      if(state.focus === a.id){ state.focus = null; setLayout(prefs.layout, false); }
      else { state.focus = a.id; setLayout("layered", false); }
      paintAreas(); render(); fit();
    });
    areasEl.appendChild(b);
  });
}

function paintTally(){
  var done = NODES.filter(function(n){ return n.done; }).length;
  var avail = NODES.filter(function(n){ return statusOf(n) === "available"; }).length;
  document.getElementById("tally").innerHTML = t("tally", {done:done, total:NODES.length, avail:avail});
}

function paintLayoutSeg(){
  var seg = document.getElementById("layoutSeg");
  seg.innerHTML = "";
  LAYOUTS.forEach(function(id, i){
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(state.layout === id));
    b.innerHTML = "";
    b.appendChild(document.createTextNode(t("layout." + id)));
    var kb = document.createElement("span");
    kb.className = "kb"; kb.textContent = String(i + 1);
    b.appendChild(kb);
    b.onclick = function(){ setLayout(id, true); };
    seg.appendChild(b);
  });
}

function setLayout(id, persist){
  state.layout = id;
  if(persist){ prefs.layout = id; savePrefs(); }
  paintLayoutSeg();
  render();
  fit();
  if(settingsOpen()) paintSettings();
}

var qlist = document.getElementById("qlist");
function paintQueue(){

    .sort(function(a, b){ return b.priority - a.priority || a.name.localeCompare(b.name); })

  setBody.appendChild(choiceRow(
    t("set.motion"), t("set.motionNote"),
    [{id:"full", label:t("mo.full")}, {id:"reduced", label:t("mo.reduced")}],
    state.motion,
    function(id){ state.motion = id; document.body.dataset.motion = id; savePrefs(); paintSettings(); }
  ));
}

function setLang(id){
  if(!langById[id]) return;
  state.lang = id;
  prefs.lang = id;
  ensureFont(id);
  savePrefs();
  paintChrome();
  render();
  if(settingsOpen()) paintSettings();
}

document.getElementById("setBtn").onclick = function(){ paintSettings(); dlg.showModal(); };
document.getElementById("setClose").onclick = function(){ dlg.close(); };
dlg.addEventListener("click", function(ev){ if(ev.target === dlg) dlg.close(); });

/* ============================================================
   11. Command layer
   One grammar, one parser, one set of commands. The palette below
   is only a front end for it; a `branchy` binary would parse the
   same words with clap and produce the same commands, and both
   would become the same Automerge operations.

     add <name> [in <direction>] [after a, b] [before c] [pri n]
     done <task>            undone <task>
     link <a> after <b>     link <a> before <b>
     unlink <a> after <b>
     rm <task>              pri <task> <n>      go <task>
   ============================================================ */

var KEYWORDS = {"in":1, "after":1, "needs":1, "before":1, "blocks":1, "pri":1, "priority":1};

function esc(x){
  return String(x).replace(/[&<>"]/g, function(ch){
    return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[ch];
  });
}

function tokenize(text){
  var out = [], cur = "", quoted = false, open = false;
  for(var i = 0; i < text.length; i++){
    var ch = text[i];
    if(ch === '"'){ open = !open; quoted = true; continue; }
    if(!open && /\s/.test(ch)){
      if(cur || quoted){ out.push(cur); cur = ""; quoted = false; }
      continue;
    }
    cur += ch;
  }
  if(cur || quoted) out.push(cur);
  return out;
}

function resolveNode(word){
  if(!word) return {error:"cmd.errName"};
  var lo = word.toLowerCase();
  var exact = NODES.filter(function(n){
    return n.id.toLowerCase() === lo || n.name.toLowerCase() === lo;
  });
  if(exact.length === 1) return {node:exact[0]};
  var hits = NODES.filter(function(n){
    return n.id.toLowerCase().indexOf(lo) !== -1 || n.name.toLowerCase().indexOf(lo) !== -1;
  });
  if(hits.length === 1) return {node:hits[0]};
  if(!hits.length) return {error:"cmd.errNoMatch", word:word};
  return {error:"cmd.errAmbiguous", word:word, candidates:hits};
}

function resolveArea(word){
  if(!word) return {area:AREAS[0]};
  var lo = word.toLowerCase();
  var hits = AREAS.filter(function(a){
    return a.id.toLowerCase().indexOf(lo) === 0 || a.name.toLowerCase().indexOf(lo) !== -1;
  });
  if(hits.length === 1) return {area:hits[0]};
  return {error:"cmd.errArea", word:word};
}

// Walk prerequisite edges from `from`. A step cur -> p means "cur needs p",
// so the returned chain reads left to right as "needs".
function reachPath(from, to){
  var parent = {}, seen = {}, queue = [from];
  seen[from] = true;
  while(queue.length){
    var cur = queue.shift();
    if(cur === to){
      var path = [], c = to;
      while(c !== undefined){ path.push(c); c = parent[c]; }
      return path.reverse();
    }
    var node = byId[cur];
    if(!node) continue;
    for(var i = 0; i < node.prereqs.length; i++){
      var pid = node.prereqs[i];
      if(byId[pid] && !seen[pid]){ seen[pid] = true; parent[pid] = cur; queue.push(pid); }
    }
  }
  return null;
}

// Adding "dep needs prereq" closes a loop exactly when prereq already
// reaches dep through its own prerequisites.
function cycleFor(depId, prereqId){
  var chain = reachPath(prereqId, depId);
  if(!chain) return null;
  return chain.concat([prereqId]);
}

function freshId(name){
  var base = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "task";
  var id = base, i = 2;
  while(byId[id]) id = base + "-" + (i++);
  return id;
}

function splitList(vals){
  return vals.join(" ").split(",").map(function(x){ return x.trim(); }).filter(Boolean);
}

/* returns {empty} | {error, word, candidates, cycle} | {preview, run} */
function parseCommand(text){
  var tk = tokenize(text.trim());
  if(!tk.length) return {empty:true};
  var verb = tk[0].toLowerCase(), rest = tk.slice(1);

  function one(){ return resolveNode(rest.join(" ").trim()); }

  if(verb === "add"){
    var i = 0, nameParts = [];
    while(i < rest.length && !KEYWORDS[rest[i].toLowerCase()]) nameParts.push(rest[i++]);
    var name = nameParts.join(" ").trim();
    if(!name) return {error:"cmd.errName"};

    var areaRef = null, afterRefs = [], beforeRefs = [], pri = 5;
    while(i < rest.length){
      var kw = rest[i++].toLowerCase(), vals = [];
      while(i < rest.length && !KEYWORDS[rest[i].toLowerCase()]) vals.push(rest[i++]);
      if(kw === "in") areaRef = vals.join(" ").trim();
      else if(kw === "after" || kw === "needs") afterRefs = afterRefs.concat(splitList(vals));
      else if(kw === "before" || kw === "blocks") beforeRefs = beforeRefs.concat(splitList(vals));
      else {
        pri = parseInt(vals[0], 10);
        if(isNaN(pri)) return {error:"cmd.errPri"};
      }
    }

    var ar = resolveArea(areaRef);
    if(ar.error) return ar;

    var afters = [], befores = [], k, r;
    for(k = 0; k < afterRefs.length; k++){
      r = resolveNode(afterRefs[k]);
      if(r.error) return r;
      afters.push(r.node);
    }
    for(k = 0; k < beforeRefs.length; k++){
      r = resolveNode(beforeRefs[k]);
      if(r.error) return r;
      befores.push(r.node);
    }
    // the new node is empty, so only after+before together can close a loop
    for(k = 0; k < afters.length; k++){
      for(var m = 0; m < befores.length; m++){
        var chain = reachPath(afters[k].id, befores[m].id);
        if(chain) return {error:"cmd.errCycle", cycle:[name].concat(chain.map(function(id){ return byId[id].name; })).concat([name])};
      }
    }

    var bits = [t("cmd.pAdd", {name:esc(name)}), esc(ar.area.name)];
    if(afters.length) bits.push(t("needs") + ": " + afters.map(function(n){ return esc(n.name); }).join(", "));
    if(befores.length) bits.push(t("unlocksLbl") + ": " + befores.map(function(n){ return esc(n.name); }).join(", "));
    bits.push(t("priority", {p:pri}));

    return {
      preview: bits.join(" &middot; "),
      run: function(){
        var id = freshId(name);
        NODES.push({
          id:id, area:ar.area.id, name:name, note:"",
          prereqs:afters.map(function(n){ return n.id; }),
          done:false, priority:pri
        });
        befores.forEach(function(b){ if(b.prereqs.indexOf(id) === -1) b.prereqs.push(id); });
        reindex();
        return id;
      }
    };
  }

  if(verb === "done" || verb === "undone"){
    var rd = one();
    if(rd.error) return rd;
    var want = verb === "done";
    return {
      preview: t(want ? "cmd.pDone" : "cmd.pUndone", {name:esc(rd.node.name)}),
      run: function(){ setDone(rd.node, want); return rd.node.id; }
    };
  }

  if(verb === "go"){
    var rg = one();
    if(rg.error) return rg;
    return {preview: t("cmd.pGo", {name:esc(rg.node.name)}), run: function(){ return rg.node.id; }};
  }

  if(verb === "rm" || verb === "del" || verb === "delete"){
    var rr = one();
    if(rr.error) return rr;
    return {
      preview: t("cmd.pRm", {name:esc(rr.node.name)}),
      run: function(){
        var gone = rr.node.id;
        NODES = NODES.filter(function(n){ return n.id !== gone; });
        NODES.forEach(function(n){
          n.prereqs = n.prereqs.filter(function(p){ return p !== gone; });
        });
        if(state.selected === gone) state.selected = null;
        reindex();
        return null;
      }
    };
  }

  if(verb === "pri" || verb === "priority"){
    if(rest.length < 2) return {error:"cmd.errPri"};
    var pv = parseInt(rest[rest.length - 1], 10);
    if(isNaN(pv)) return {error:"cmd.errPri"};
    var rp = resolveNode(rest.slice(0, -1).join(" ").trim());
    if(rp.error) return rp;
    return {
      preview: t("cmd.pPri", {a:esc(rp.node.name), n:pv}),
      run: function(){ rp.node.priority = pv; reindex(); return rp.node.id; }
    };
  }

  if(verb === "link" || verb === "unlink"){
    var sepAt = -1, sep = null;
    for(var j = 0; j < rest.length; j++){
      var w = rest[j].toLowerCase();
      if(w === "after" || w === "needs" || w === "before" || w === "blocks"){ sepAt = j; sep = w; break; }
    }
    if(sepAt < 1 || sepAt === rest.length - 1) return {error:"cmd.errNeedTwo"};
    var ra = resolveNode(rest.slice(0, sepAt).join(" ").trim());
    if(ra.error) return ra;
    var rb = resolveNode(rest.slice(sepAt + 1).join(" ").trim());
    if(rb.error) return rb;

    // "A before B" is the same edge as "B after A"
    var dep = (sep === "before" || sep === "blocks") ? rb.node : ra.node;
    var pre = (sep === "before" || sep === "blocks") ? ra.node : rb.node;

    if(verb === "link"){
      var cyc = cycleFor(dep.id, pre.id);
      if(cyc) return {error:"cmd.errCycle", cycle:cyc.map(function(id){ return byId[id].name; })};
      return {
        preview: t("cmd.pLink", {a:esc(dep.name), b:esc(pre.name)}),
        run: function(){
          if(dep.prereqs.indexOf(pre.id) === -1) dep.prereqs.push(pre.id);
          reindex();
          return dep.id;
        }
      };
    }
    if(dep.prereqs.indexOf(pre.id) === -1){
      return {error:"cmd.errNoLink", a:dep.name, b:pre.name};
    }
    return {
      preview: t("cmd.pUnlink", {a:esc(dep.name), b:esc(pre.name)}),
      run: function(){
        dep.prereqs = dep.prereqs.filter(function(x){ return x !== pre.id; });
        reindex();
        return dep.id;
      }
    };
  }

  return {error:"cmd.errUnknown", word:verb};
}

/* ---------- palette ---------- */

var palette = document.getElementById("palette");
var palIn = document.getElementById("pal");
var palOut = document.getElementById("palOut");
var palSugg = document.getElementById("palSugg");

function openPalette(seed){
  palette.hidden = false;
  palIn.value = seed || "";
  palIn.focus();
  refreshPalette();
}
function closePalette(){
  palette.hidden = true;
  palIn.value = "";
  palIn.blur();
}

function errorText(res){
  if(res.error === "cmd.errCycle"){
    var txt = t("cmd.errCycle");
    if(res.cycle){
      txt += '<span class="cyc">' + res.cycle.map(esc).join(" → ") + "</span>";
    }
    return txt;
  }
  return t(res.error, {w:esc(res.word || ""), a:esc(res.a || ""), b:esc(res.b || "")});
}

function refreshPalette(){
  var res = parseCommand(palIn.value);
  palSugg.innerHTML = "";

  if(res.empty){
    palOut.className = "pal-out";
    palOut.textContent = "";
  }else if(res.error){
    palOut.className = "pal-out err";
    palOut.innerHTML = errorText(res);
    (res.candidates || []).slice(0, 8).forEach(function(n){ suggest(n.name); });
  }else{
    palOut.className = "pal-out ok";
    palOut.innerHTML = res.preview;
  }

  // suggest task names for the fragment being typed
  if(!res.candidates){
    var tail = palIn.value.split(/[\s,]+/).pop().toLowerCase();
    if(tail.length >= 2 && !KEYWORDS[tail]){
      NODES.filter(function(n){
        return n.id.indexOf(tail) === 0 || n.name.toLowerCase().indexOf(tail) !== -1;
      }).slice(0, 8).forEach(function(n){ suggest(n.id); });
    }
  }
}

function suggest(word){
  var li = document.createElement("li");
  li.textContent = word;
  li.onclick = function(){
    var parts = palIn.value.split(/([\s,]+)/);
    parts[parts.length - 1] = word;
    palIn.value = parts.join("") + " ";
    palIn.focus();
    refreshPalette();
  };
  palSugg.appendChild(li);
}

function runPalette(){
  var res = parseCommand(palIn.value);
  if(res.empty || res.error) return;
  var touched = res.run();
  closePalette();
  render();
  paintAreas(); paintTally(); paintQueue();
  if(touched && byId[touched]){
    if(!isShown(touched)){
      state.focus = null;
      state.visible[byId[touched].area] = true;
      paintAreas();
      render();
    }
    select(touched);
  }else{
    select(null);
  }
}

palIn.addEventListener("input", refreshPalette);
palIn.addEventListener("keydown", function(ev){
  if(ev.key === "Enter"){ ev.preventDefault(); runPalette(); }
  else if(ev.key === "Escape"){ ev.preventDefault(); closePalette(); }
  ev.stopPropagation();
});
palette.addEventListener("click", function(ev){ if(ev.target === palette) closePalette(); });

/* ---------- wiring ---------- */

var qInput = document.getElementById("q");
qInput.addEventListener("input", function(){ state.query = qInput.value; updateEmphasis(); });
document.getElementById("rxBtn").addEventListener("click", function(){
  state.regex = !state.regex;
  this.setAttribute("aria-pressed", String(state.regex));
  qInput.placeholder = state.regex ? t("search.phRx") : t("search.ph");
  updateEmphasis();
});

var queueEl = document.getElementById("queue");
var queueBtn = document.getElementById("queueBtn");
function toggleQueue(on){
  var show = on === undefined ? queueEl.hidden : on;
  queueEl.hidden = !show;
  queueBtn.setAttribute("aria-pressed", String(show));
  if(show) paintQueue();
}
queueBtn.addEventListener("click", function(){ toggleQueue(); });
document.getElementById("qClose").addEventListener("click", function(){ toggleQueue(false); });

document.getElementById("allBtn").addEventListener("click", function(){
  state.focus = null;
  AREAS.forEach(function(a){ state.visible[a.id] = true; });
  setLayout(prefs.layout, false);
  paintAreas();
});

var dockEl = document.getElementById("dock");
document.getElementById("dockToggle").addEventListener("click", function(){ dockEl.hidden = !dockEl.hidden; });

document.addEventListener("keydown", function(ev){
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k"){
    ev.preventDefault();
    if(palette.hidden) openPalette(); else closePalette();
    return;
  }
  if(dlg.open || !palette.hidden) return;
  var typing = ev.target === qInput;
  if(ev.key === ":" && !typing){ ev.preventDefault(); openPalette(); return; }
  if(ev.key === "/" && !typing){ ev.preventDefault(); qInput.focus(); qInput.select(); return; }
  if(ev.key === "Escape"){
    if(typing){ qInput.value = ""; state.query = ""; updateEmphasis(); qInput.blur(); }
    else if(!queueEl.hidden) toggleQueue(false);
    else select(null);
    return;
  }
  if(typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var k = ev.key.toLowerCase();
  if(k === "f") fit();
  else if(k === "q") toggleQueue();
  else if(k === "s"){ paintSettings(); dlg.showModal(); }
  else if(k === "1" || k === "2" || k === "3") setLayout(LAYOUTS[Number(k) - 1], true);
});

var resizeTimer = null;
window.addEventListener("resize", function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ fit(0); }, 140);
});

/* ---------- boot ---------- */
document.body.dataset.skin = state.skin;
document.body.dataset.motion = state.motion;
document.getElementById("row").classList.toggle("dock-right", state.dockSide === "right");
ensureFont(state.lang);
paintChrome();
if(window.innerWidth <= 860) dockEl.hidden = true;
render();
// select first: the inspector narrows the stage, and the fit has to know that
// opens on the cross-direction case, but without dimming the rest of the tree
if(window.innerWidth > 1180) select("lob", false, false);
fit(0);
})();
</script>
